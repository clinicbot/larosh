name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Capacitor project
        shell: bash
        run: |
          npm init -y
          npm install --save-exact @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
          mkdir -p www
          printf '<!doctype html><html><head><title>DermaMatch</title></head><body>Loading...</body></html>' > www/index.html
          npx cap init "DermaMatch" com.clinicbot.dermamatch --web-dir=www
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.clinicbot.dermamatch",
            "appName": "DermaMatch",
            "webDir": "www",
            "server": {
              "url": "https://clinicbot.github.io/larosh/",
              "cleartext": false
            }
          }
          JSON
          npx cap add android

      - name: Configure Android app icon
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          ICON=".github/workflows/appl.png"
          test -s "$ICON"
          for spec in "mdpi:108" "hdpi:162" "xhdpi:216" "xxhdpi:324" "xxxhdpi:432"; do
            density="${spec%%:*}"
            pixels="${spec##*:}"
            target="android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
            mkdir -p "$(dirname "$target")"
            convert "$ICON" -resize "${pixels}x${pixels}" -background none -gravity center -extent "${pixels}x${pixels}" "$target"
          done

      - name: Configure Android version and signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_ALIAS_PASSWORD; do
            if [ -z "${!var}" ]; then echo "Missing required signing secret: $var"; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/derma_keystore.jks
          test -s android/app/derma_keystore.jks
          python3 - <<'PY'
          import os, re
          variables = 'android/variables.gradle'
          with open(variables, encoding='utf-8') as f:
              s = f.read()
          s = re.sub(r'(compileSdkVersion\s*=\s*)\d+', r'\g<1>35', s)
          s = re.sub(r'(targetSdkVersion\s*=\s*)\d+', r'\g<1>35', s)
          with open(variables, 'w', encoding='utf-8') as f:
              f.write(s)
          path = 'android/app/build.gradle'
          with open(path, encoding='utf-8') as f:
              s = f.read()
          code = 22 + int(os.environ['RUN_NUMBER'])
          s, nc = re.subn(r'\bversionCode\s+\d+', f'versionCode {code}', s, count=1)
          s, nn = re.subn(r'\bversionName\s+["\'][^"\']+["\']', f'versionName "1.0.{code}"', s, count=1)
          if nc != 1 or nn != 1:
              raise SystemExit('Missing versionCode or versionName in generated Gradle file')
          s += """
          android {
              signingConfigs {
                  release {
                      storeFile file("derma_keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_ALIAS_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """
          with open(path, 'w', encoding='utf-8') as f:
              f.write(s)
          print('Configured versionCode', code)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build signed release APK and AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: DermaMatch-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
